# Render 部署設定：Telegram 訂房 Bot（Web Service，免費方案）
# 部署方式：把本專案推到 GitHub 後，在 Render 後台 New -> Web Service -> 連接該 repo 即可
#           （服務類型必須是 Web Service，webhook 才會有對外網址 RENDER_EXTERNAL_URL）。
# TELEGRAM_BOT_TOKEN 請在 Render 後台 Environment 手動設定（不要寫進此檔，避免外洩）。
# Bot 啟動時會自動用 RENDER_EXTERNAL_URL 呼叫 setWebhook，無需手動設定 webhook。
services:
  - type: web
    name: booking-bot
    env: python
    plan: free
    # 證件 OCR 需要 Tesseract 與中文語言包；apt-get 裝好後再 pip 安裝依賴。
    # 若你是從 GitHub 用此 render.yaml 建立 Bluepint，這段會生效；
    # 若是既有的 Web Service，請到 Render 後台 Settings → Build Command 改成同一行。
    buildCommand: apt-get update && apt-get install -y tesseract-ocr tesseract-ocr-chi-tra tesseract-ocr-chi-sim && pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
